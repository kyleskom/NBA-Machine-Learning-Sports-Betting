[player-injuries]
    adapter = "nba_official_pdf"
    pdf_url_template = "https://ak-static.cms.nba.com/referee/injury/Injury-Report_{date}_{time}.pdf"
    report_times = ["05_00AM", "11_00AM", "01_30PM", "05_00PM"]
    timeout_seconds = 20
    json_path = ""
    primary_url = ""
    secondary_url = ""

[player-lineups]
    adapter = "nba_daily_lineups"
    daily_lineups_url_template = "https://stats.nba.com/js/data/leaders/00_daily_lineups_{date_compact}.json"
    timeout_seconds = 20
    attempts = 2
    primary_url = ""
    secondary_url = ""
    json_path = ""

[player-features]
    rolling_windows = [7, 14, 30]
    stats_max_age_days = 45
    report_max_age_hours = 24

    [player-features.defaults]
        neutral_player_minutes = 16.0
        neutral_player_usage = 0.18
        neutral_team_minutes = 240.0
        default_inj_avail_min_wt = 1.0
        default_inj_coverage = 0.0
        default_lineup_expected_starters = 5.0
        default_lineup_coverage = 0.0

        [player-features.defaults.injury_weights]
            out = 1.0
            doubtful = 0.75
            questionable = 0.5
            probable = 0.25
            active = 0.0
            unknown = 0.5

[player-ingestion]
    provider = "archive"
    game_logs_url = "https://stats.nba.com/stats/leaguegamelog"
    archive_url_template = "https://github.com/sportsdataverse/sportsdataverse-data/releases/download/espn_nba_player_boxscores/player_box_{year}.csv"
    timeout_seconds = 45
    attempts = 3

[player-rosters]
    adapter = "nba_daily_lineups"
    daily_lineups_url_template = "https://stats.nba.com/js/data/leaders/00_daily_lineups_{date_compact}.json"
    timeout_seconds = 20
    attempts = 2
    primary_url = ""
    secondary_url = ""
    json_path = ""

[bet-eligibility]
    # Do not issue wagers when player availability cannot be verified.
    require_complete_availability = true
    require_confirmed_lineups = true
